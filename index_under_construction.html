<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Under Construction | Sardar Sukhpal Singh Khaira</title>
<meta name="description" content="Official website preview page for Sardar Sukhpal Singh Khaira. Site under construction.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#071a31;color:#fff}
.hero{min-height:100dvh;position:relative;display:grid;place-items:center;text-align:center;padding:32px 18px;
background:linear-gradient(rgba(4,20,39,.50),rgba(4,20,39,.90)),url('sukhpal-khaira-hero.jpg') center/cover no-repeat}
.card{width:min(720px,94vw);padding:34px 26px;border:1px solid rgba(255,255,255,.25);border-radius:24px;
background:rgba(3,17,33,.62);backdrop-filter:blur(8px);box-shadow:0 18px 60px rgba(0,0,0,.35)}
.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:700}
h1{font-size:clamp(34px,7vw,68px);line-height:1.02;margin:18px 0 10px}
.name{font-size:clamp(20px,4vw,30px);font-weight:700;margin:0 0 12px}
p{font-size:clamp(16px,2.5vw,19px);line-height:1.55;margin:10px auto 24px;max-width:580px}
.btn{display:inline-block;text-decoration:none;background:#1877f2;color:white;padding:14px 22px;border-radius:12px;
font-weight:700;font-size:17px;transition:.2s}.btn:hover{transform:translateY(-2px)}
.small{margin-top:24px;font-size:13px;opacity:.78}
@media(max-width:600px){.hero{padding:20px 14px}.card{padding:28px 17px;border-radius:18px}}
</style>
</head>
<body>
<main class="hero">
<section class="card" aria-label="Website under construction">
<div class="badge">Website Update</div>
<h1>Under Construction</h1>
<div class="name">Sardar Sukhpal Singh Khaira</div>
<p>Our website is currently being prepared. For public updates and information, visit the Facebook page below.</p>
<a class="btn" href="https://www.facebook.com/SukhpalKhairaINC" target="_blank" rel="noopener noreferrer">Visit Facebook Page</a>
<div class="small">Please check back soon.</div>
</section>
</main>
</body>
</html>
